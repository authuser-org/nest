name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install --global npm@11.19.1
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          node --input-type=commonjs -e
          "const p=JSON.parse(require('node:fs').readFileSync('package.json'));
          if ('v'+p.version!==process.env.RELEASE_TAG)
          throw new Error('Release tag does not match package version')"
      - run: npm ci
      - run: npm run check
      - run: npm run test:coverage
      - run: npm run test:package
      - run: npm ci --prefix example
      - run: npm run smoke --prefix example
      - run: npm publish --access public --provenance
